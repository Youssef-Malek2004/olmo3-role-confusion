[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olmo3-role-confusion"
version = "0.1.0"
description = "Prompt injection as role confusion across OLMo 3 post-training stages: behaviour, role directions, and turn-conditioned steering"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
